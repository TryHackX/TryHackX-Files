name: CI

on:
  # Branches are tested through their pull request; running `push` on every branch as well
  # executed everything twice (including the 30-minute Docker job) for each Dependabot update.
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
  workflow_dispatch:

# A newer commit on the same pull request makes the older run pointless. Runs for main and tags
# always finish, so a release commit is never left without a verdict.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  repository-policy:
    name: Syntax, secrets and pinned inputs
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.4'
          coverage: none
          tools: none
        env:
          fail-fast: true

      - name: Enforce repository policy
        run: php scripts/check-repository-policy.php

      - name: Lint PHP
        run: find public scripts src tests/php -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Install locked PHP analysis dependencies
        run: composer install --no-interaction --no-progress --prefer-dist --no-scripts

      - name: Validate Composer manifest and lock
        run: composer validate --strict

      - name: Run PHPStan
        run: composer analyse

      - name: Compile Python
        run: python3 -m compileall -q upload_server.py tests/python

      - name: Test shared browser UI helpers
        run: node --test tests/js/*.test.js

      - name: Validate shell scripts
        run: find . -type f -name '*.sh' -not -path './venv/*' -not -path './vendor/*' -print0 | xargs -0 -r -n1 bash -n

      # ShellCheck ships with the runner image. SC2154 is a false positive for the variable a
      # single-quoted trap string assigns and reads when it fires.
      - name: Lint shell scripts
        run: |
          find . -type f -name '*.sh' -not -path './venv/*' -not -path './vendor/*' -print0 \
            | xargs -0 -r shellcheck --severity=warning --exclude=SC2154

      # What a re-run of the Debian installer keeps (account, PHP handler, database, directories),
      # against fixture units; nothing is installed.
      - name: Test the Debian installer's re-run decisions
        run: bash tests/shell/install-debian-test.sh

      - name: Validate Compose model
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
          MYSQL_PASSWORD: ci-app-password
          FILEHOST_CANONICAL_URL: http://localhost:8080
        run: docker compose config --quiet

  php-repositories:
    name: PHPUnit (${{ matrix.database }}, PHP ${{ matrix.php }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # 8.1 is the declared minimum, 8.4 the middle, 8.5 what production runs. MariaDB 11.4 is
        # the oldest LTS covered, 11.8 is the production server, MySQL 8.4 the other family.
        php: ['8.1', '8.4', '8.5']
        database:
          - mysql-8.4
          - mariadb-11.4
          - mariadb-11.8
        exclude:
          - php: '8.1'
            database: mariadb-11.8
          - php: '8.4'
            database: mariadb-11.8
          - php: '8.5'
            database: mariadb-11.4
        include:
          # PHPUnit 10.5 is the last line that supports PHP 8.1; 12.5 needs 8.3+.
          - php: '8.1'
            phpunit_version: '10.5.66'
            phpunit_sha256: 42bcac97bbf9fb1aecf5a7d6a1b37123a11e7e295458978f0e268999f6d9e50f
          - php: '8.4'
            phpunit_version: '12.5.39'
            phpunit_sha256: cf9a68e3e294257fac2da235c2dcfef29efd90462cafd67941ef32f52142dfce
          - php: '8.5'
            phpunit_version: '12.5.39'
            phpunit_sha256: cf9a68e3e294257fac2da235c2dcfef29efd90462cafd67941ef32f52142dfce
          - database: mysql-8.4
            database_image: mysql:8.4
          - database: mariadb-11.4
            database_image: mariadb:11.4
          - database: mariadb-11.8
            database_image: mariadb:11.8

    services:
      database:
        image: ${{ matrix.database_image }}
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_ROOT_HOST: "%"
        ports:
          - 3306:3306

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_mysql, openssl
          coverage: none
          tools: none
        env:
          fail-fast: true

      - name: Wait for SQL server
        run: |
          for attempt in {1..60}; do
            if php -r 'new PDO("mysql:host=127.0.0.1;port=3306;charset=utf8mb4", "root", "root", [PDO::ATTR_ERRMODE => PDO::ERRMODE_EXCEPTION]);' 2>/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "SQL service did not become ready" >&2
          exit 1

      - name: Download verified PHPUnit
        env:
          PHPUNIT_VERSION: ${{ matrix.phpunit_version }}
          PHPUNIT_SHA256: ${{ matrix.phpunit_sha256 }}
        run: |
          curl --fail --location --silent --show-error \
            --output tools/phpunit.phar \
            "https://phar.phpunit.de/phpunit-${PHPUNIT_VERSION}.phar"
          echo "${PHPUNIT_SHA256}  tools/phpunit.phar" | sha256sum --check --strict

      - name: Run repository tests
        env:
          TEST_DB_HOST: 127.0.0.1
          TEST_DB_USER: root
          TEST_DB_PASS: root
          ALLOW_DESTRUCTIVE_TEST_DB: "YES"
        run: |
          TEST_DB_NONCE="$(php -r 'echo bin2hex(random_bytes(12));')"
          export TEST_DB_NONCE
          export TEST_DB_NAME="filehost_ci_test_${TEST_DB_NONCE}"
          php tools/phpunit.phar -c tests/php/phpunit.xml

  python-upload-server:
    name: pytest (Python ${{ matrix.python }})
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11', '3.13', '3.14']

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install dependencies
        run: python -m pip install --require-hashes -r requirements-dev-lock.txt

      - name: Verify dependency environment
        run: python -m pip check

      - name: Run Ruff
        if: matrix.python == '3.14'
        run: python -m ruff check upload_server.py tests/python

      - name: Run pytest
        run: python -m pytest tests/python -q

  docker-smoke:
    name: Docker fresh install and transfer smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs:
      - repository-policy
      - php-repositories
      - python-upload-server
    env:
      MYSQL_ROOT_PASSWORD: ci-root-password
      MYSQL_DATABASE: filehost_ci
      MYSQL_USER: filehost_ci
      MYSQL_PASSWORD: ci-app-password
      HTTP_PORT: '8080'
      FILEHOST_CANONICAL_URL: http://localhost:8080
      FILEHOST_INSTALL_TOKEN: ci-bootstrap-token-not-used-by-cli-smoke
      FILEHOST_INSTALL_ALLOW_IPS: 172.16.0.0/12
      FILEHOST_DOWNLOAD_LEASE_SECONDS: '5'
      FILEHOST_CI_SMOKE: '1'
      FILEHOST_CI_PREBODY_DELAY_MS: '5000'

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Job logs need a GitHub login; check-run annotations do not. Every step below turns
      # its failure into an `::error` annotation (tests/smoke/gh-annotate.sh), readable through
      # GET /repos/{owner}/{repo}/check-runs/{id}/annotations without a token.
      - name: Build image
        run: |
          set -o pipefail
          if ! docker compose build --pull app 2>&1 | tee build.log; then
            bash tests/smoke/gh-annotate.sh error "Docker smoke: image build failed" "$(tail -n 40 build.log)"
            exit 1
          fi

      - name: Start isolated stack
        run: |
          if ! docker compose up --detach db app; then
            bash tests/smoke/gh-annotate.sh logs "Docker smoke: stack did not start"
            exit 1
          fi

      - name: Bootstrap fresh schema
        run: |
          if ! output="$(docker compose exec --no-TTY --user www-data \
            -e FILEHOST_CI_BOOTSTRAP=1 \
            -e FILEHOST_DB_HOST=db \
            -e FILEHOST_DB_USER="${MYSQL_USER}" \
            -e FILEHOST_DB_PASS="${MYSQL_PASSWORD}" \
            -e FILEHOST_DB_NAME="${MYSQL_DATABASE}" \
            -e FILEHOST_DB_PREFIX=fh_ \
            -e FILEHOST_CANONICAL_URL="${FILEHOST_CANONICAL_URL}" \
            app php scripts/ci-bootstrap-install.php 2>&1)"; then
            printf '%s\n' "${output}"
            bash tests/smoke/gh-annotate.sh error "Docker smoke: schema bootstrap failed" "${output}"
            exit 1
          fi
          printf '%s\n' "${output}"
          docker compose restart app

      - name: Wait for page and readiness
        run: |
          page_status=""
          ready_status=""
          for attempt in {1..90}; do
            page_status="$(curl --silent --output /dev/null --write-out '%{http_code}' \
              "${FILEHOST_CANONICAL_URL}/" || true)"
            ready_status="$(docker compose exec --no-TTY app /app/venv/bin/python -c \
              'import urllib.request; print(urllib.request.urlopen("http://127.0.0.1:8001/ready", timeout=2).status)' \
              2>/dev/null || true)"
            if [ "${page_status}" = "200" ] && [ "${ready_status}" = "200" ]; then
              exit 0
            fi
            sleep 2
          done
          docker compose ps
          docker compose logs --no-color app
          bash tests/smoke/gh-annotate.sh error "Docker smoke: stack never became ready" \
            "home page HTTP '${page_status}', upload server /ready '${ready_status}' after 90 attempts"
          bash tests/smoke/gh-annotate.sh logs "Docker smoke: app log tail while waiting" app
          exit 1

      - name: Exercise upload and interrupted-download lifecycle
        run: bash tests/smoke/docker-transfer.sh

      - name: Verify relational integrity
        run: |
          status=0
          output="$(docker compose exec --no-TTY --user www-data app php scripts/check-db-integrity.php --json 2>&1)" || status=$?
          printf '%s\n' "${output}"
          if [ "${status}" -ne 0 ]; then
            bash tests/smoke/gh-annotate.sh error "Docker smoke: relational integrity (exit ${status})" "${output}"
            exit 1
          fi

      - name: Verify storage manifests and checksums
        run: |
          status=0
          output="$(docker compose exec --no-TTY --user www-data app php scripts/check-storage-integrity.php --json 2>&1)" || status=$?
          printf '%s\n' "${output}"
          if [ "${status}" -ne 0 ]; then
            bash tests/smoke/gh-annotate.sh error "Docker smoke: storage integrity (exit ${status})" "${output}"
            exit 1
          fi

      - name: Show container logs after failure
        if: failure()
        run: |
          docker compose logs --no-color
          bash tests/smoke/gh-annotate.sh logs "Docker smoke: compose log tail after the failure"

      - name: Remove isolated stack
        if: always()
        run: docker compose down --volumes --remove-orphans
