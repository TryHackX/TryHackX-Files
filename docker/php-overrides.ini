; Container overrides on top of php.ini-production (copied to php.ini by docker/Dockerfile).
; Errors go to the container log (`docker compose logs app`), never to the visitor.
expose_php = Off
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
; Advertisement banners are uploaded to PHP (ads_max_banner_kb, 5 MiB by default), and the
; production template stops at 2 MiB. File uploads go to the upload server, never through PHP.
upload_max_filesize = 8M
post_max_size = 12M
