# FileHost vhost — docroot is public/ only (St1). Everything else in /app stays
# unreachable over HTTP, mirroring the bare-metal layout.
<VirtualHost *:80>
	ServerName localhost
	DocumentRoot /app/public

	<Directory /app/public>
		Options -Indexes -MultiViews
		AllowOverride All
		Require all granted
	</Directory>

	# Belt and braces: even if something ends up linked into the docroot, the
	# non-public tree is refused outright.
	<Directory /app/src>
		Require all denied
	</Directory>
	<Directory /app/config>
		Require all denied
	</Directory>
	<Directory /app/data>
		Require all denied
	</Directory>
	<Directory /app/uploads>
		Require all denied
	</Directory>

	# Container convention: logs to stdout/stderr so `docker compose logs` shows them.
	ErrorLog /dev/stderr
	CustomLog /dev/stdout combined
</VirtualHost>
