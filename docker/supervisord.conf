; Runs Apache and the Python upload server side by side in the app container.
; Both log to stdout/stderr so `docker compose logs -f app` shows everything.

[supervisord]
nodaemon=true
; Stays root to start Apache; each worker below drops to www-data. Saying so stops the
; "running as root" CRIT line at every start, which also ended up in every CI failure note.
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

; Control socket, so `supervisorctl -c /etc/supervisor/conf.d/filehost.conf status|restart|pid`
; works inside the container. supervisord is started with -c on this file alone, so without
; these sections there was no socket at all and supervisorctl fell back to Debian's default
; path. Root-only (0700): the socket can stop and start every program here.
[unix_http_server]
file=/run/supervisord.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory=supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisord.sock

[program:apache]
command=apache2-foreground
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:upload]
command=/app/docker/wait-for-install.sh /app/venv/bin/python /app/upload_server.py
directory=/app
user=www-data
environment=HOME="/tmp"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cleanup]
; Periodic housekeeping (P5): purge expired tokens / stale rows every 15 minutes.
; A tiny sleep-loop keeps it self-contained — no separate cron daemon needed.
command=/app/docker/wait-for-install.sh /bin/sh -c "while true; do php /app/scripts/cleanup.php || true; sleep 900; done"
directory=/app
user=www-data
environment=HOME="/tmp"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mail-worker]
command=/app/docker/wait-for-install.sh php /app/scripts/mail-worker.php --loop --limit=25 --sleep=5
directory=/app
user=www-data
environment=HOME="/tmp"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
