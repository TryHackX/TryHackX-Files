; Runs Apache and the Python upload server side by side in the app container.
; Both log to stdout/stderr so `docker compose logs -f app` shows everything.

[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

[program:apache]
command=apache2-foreground
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:upload]
command=/app/docker/wait-for-install.sh /app/venv/bin/python /app/upload_server.py
directory=/app
user=www-data
environment=HOME="/tmp"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cleanup]
; Periodic housekeeping (P5): purge expired tokens / stale rows every 15 minutes.
; A tiny sleep-loop keeps it self-contained — no separate cron daemon needed.
command=/app/docker/wait-for-install.sh /bin/sh -c "while true; do php /app/scripts/cleanup.php || true; sleep 900; done"
directory=/app
user=www-data
environment=HOME="/tmp"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:mail-worker]
command=/app/docker/wait-for-install.sh php /app/scripts/mail-worker.php --loop --limit=25 --sleep=5
directory=/app
user=www-data
environment=HOME="/tmp"
autostart=true
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
